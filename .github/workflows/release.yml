# Release: publish the root client library to npm when a v* tag is pushed.
# The workers/ sub-package is private and deployed via `wrangler deploy`,
# not published to npm.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish root package to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # Required for npm publish authentication via NODE_AUTH_TOKEN.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepublishOnly in package.json also builds; this makes the artifact
      # explicit and fails fast before publish.
      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
