# CI for viem-proxy: root package and workers sub-package run in parallel jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Root package: lint, typecheck, test, build.
  main:
    name: Root package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # workers/ sub-package: has its own pnpm-lock.yaml and vitest suite.
  workers:
    name: Workers sub-package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # workers/package.json has no "packageManager" field, so pin the major
      # explicitly (matches the root packageManager major).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # The workers lockfile lives in workers/, not at the repo root.
          cache-dependency-path: workers/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
